name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/compose-web:latest .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/compose-web:latest

  deploy-local:
    needs: build-test-push
    runs-on: self-hosted

    steps:
      - name: Check out the repository code
        uses: actions/checkout@v4

      - name: Pull the latest image from Docker Hub
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/compose-web:latest

      - name: Restart the application with Docker Compose
        run: docker compose up -d --force-recreate